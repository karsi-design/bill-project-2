<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPPL Bills</title>
<style>
  :root {
    --ink: #16211c;
    --ink-soft: #4b5a52;
    --paper: #f6f5f1;
    --paper-raised: #ffffff;
    --line: #d9d6cc;
    --accent: #1f6b4c;
    --accent-soft: #e4efe8;
    --warn: #9a5b12;
    --warn-soft: #fbf1e2;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 13.5px;
  }
  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 32px 64px;
  }
  section {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  section h2 {
    margin: 0 0 14px;
    font-size: 13px;
    font-weight: 650;
    text-transform: none;
    color: var(--ink-soft);
  }
  .dropzone {
    border: 1.5px dashed var(--line);
    border-radius: 8px;
    padding: 28px;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .dropzone input { display: none; }
  .upload-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=text], input[type=email], select {
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
  }
  button {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 5px 10px;
    font-size: 12.5px;
  }
  #upload-status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  #upload-status.ok { color: var(--accent); }
  #upload-status.err { color: #a32323; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left;
    font-weight: 600;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 10px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 100px;
  }
  .badge.paid { background: var(--accent-soft); color: var(--accent); }
  .badge.unpaid, .badge.unknown { background: var(--warn-soft); color: var(--warn); }
  .badge.pending_review { background: var(--warn-soft); color: var(--warn); }
  .badge.confirmed { background: var(--accent-soft); color: var(--accent); }
  a.filelink { color: var(--accent); text-decoration: none; font-size: 12.5px; }
  a.filelink:hover { text-decoration: underline; }
  #empty { color: var(--ink-soft); font-size: 13.5px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>MPPL Bills</h1>
  <p>Upload a bill — it's read, filed, and made searchable automatically.</p>
</header>

<main>
  <section>
    <h2>Upload</h2>
    <div class="dropzone" id="dropzone">
      <div id="dropzone-label">Drop a bill here (JPG, PNG, or PDF) — or click to choose a file</div>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.pdf">
    </div>
    <div class="upload-row">
      <input type="email" id="uploaded-by" placeholder="your email">
      <button id="upload-btn" disabled>Upload &amp; extract</button>
    </div>
    <div id="upload-status"></div>
  </section>

  <section>
    <h2>Bills</h2>
    <div class="filters" style="margin-bottom: 14px;">
      <input type="text" id="f-vendor" placeholder="Search vendor…">
      <select id="f-payment">
        <option value="">Any payment status</option>
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
        <option value="partially_paid">Partially paid</option>
        <option value="unknown">Unknown</option>
      </select>
      <select id="f-review">
        <option value="">Any review status</option>
        <option value="pending_review">Pending review</option>
        <option value="confirmed">Confirmed</option>
      </select>
      <button class="ghost" id="refresh-btn">Refresh</button>
    </div>
    <table id="bills-table">
      <thead>
        <tr>
          <th>Vendor</th><th>Invoice</th><th>Date</th><th style="text-align:right">Amount</th>
          <th>Payment</th><th>Review</th><th>File</th><th></th>
        </tr>
      </thead>
      <tbody id="bills-body"></tbody>
    </table>
    <div id="empty" style="display:none">No bills match those filters yet.</div>
  </section>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const dzLabel = document.getElementById('dropzone-label');
const uploadBtn = document.getElementById('upload-btn');
const uploadedByInput = document.getElementById('uploaded-by');
const statusEl = document.getElementById('upload-status');

let selectedFile = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(f) {
  selectedFile = f;
  dzLabel.textContent = `Selected: ${f.name}`;
  uploadBtn.disabled = false;
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const uploadedBy = uploadedByInput.value.trim() || 'unknown';

  uploadBtn.disabled = true;
  statusEl.className = '';
  statusEl.textContent = 'Reading and filing the bill — this takes a few seconds…';

  const form = new FormData();
  form.append('file', selectedFile);
  form.append('uploaded_by', uploadedBy);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');

    statusEl.className = 'ok';
    statusEl.textContent = `Saved — ${data.extracted.vendor_name}, ₹${data.extracted.amount ?? '?'}. Marked pending review.`;
    selectedFile = null;
    fileInput.value = '';
    dzLabel.textContent = 'Drop a bill here (JPG, PNG, or PDF) — or click to choose a file';
    loadBills();
  } catch (err) {
    statusEl.className = 'err';
    statusEl.textContent = err.message;
  } finally {
    uploadBtn.disabled = false;
  }
});

const body = document.getElementById('bills-body');
const emptyEl = document.getElementById('empty');

function badge(text, cls) {
  return `<span class="badge ${cls}">${text.replace('_', ' ')}</span>`;
}

async function loadBills() {
  const params = new URLSearchParams();
  const vendor = document.getElementById('f-vendor').value.trim();
  const payment = document.getElementById('f-payment').value;
  const review = document.getElementById('f-review').value;
  if (vendor) params.set('vendor', vendor);
  if (payment) params.set('payment_status', payment);
  if (review) params.set('review_status', review);

  const res = await fetch('/api/bills?' + params.toString());
  const rows = await res.json();

  body.innerHTML = '';
  emptyEl.style.display = rows.length ? 'none' : 'block';

  for (const r of rows) {
    const tr = document.createElement('tr');
    const amount = r.amount != null ? Number(r.amount).toLocaleString('en-IN', { minimumFractionDigits: 2 }) : '—';
    tr.innerHTML = `
      <td>${r.vendor_name || ''}</td>
      <td>${r.invoice_no || '—'}</td>
      <td>${r.invoice_date || '—'}</td>
      <td class="num">${amount}</td>
      <td>${badge(r.payment_status || 'unknown', r.payment_status || 'unknown')}</td>
      <td>${badge(r.review_status || 'pending_review', r.review_status || 'pending_review')}</td>
      <td>${r.drive_link ? `<a class="filelink" href="${r.drive_link}" target="_blank">Open</a>` : '—'}</td>
      <td>${r.review_status === 'pending_review' ? `<button class="ghost" data-id="${r.id}">Confirm</button>` : ''}</td>
    `;
    body.appendChild(tr);
  }

  body.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const confirmedBy = uploadedByInput.value.trim() || 'unknown';
      await fetch('/api/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: Number(id), confirmed_by: confirmedBy }),
      });
      loadBills();
    });
  });
}

document.getElementById('refresh-btn').addEventListener('click', loadBills);
document.getElementById('f-vendor').addEventListener('keydown', e => { if (e.key === 'Enter') loadBills(); });
document.getElementById('f-payment').addEventListener('change', loadBills);
document.getElementById('f-review').addEventListener('change', loadBills);

loadBills();
</script>
</body>
</html>
