<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MPPL Bills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efe9dd;
    --paper-raised: #faf7f0;
    --ink: #211e1a;
    --ink-soft: #6b6255;
    --line: #d9cfbb;
    --line-strong: #b9ab8d;

    --stamp-ink: #3e3465;
    --stamp-ink-soft: #e9e5f0;

    --paid: #2f6f4f;
    --paid-wash: #e4efe6;
    --pending: #a6672b;
    --pending-wash: #f6e9db;

    --serif: 'Zilla Slab', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px);
    background-size: 100% 42px;
    background-attachment: local;
  }

  header {
    padding: 36px 40px 26px;
    border-bottom: 3px double var(--line-strong);
    background: var(--paper);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .wordmark {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .wordmark .folio {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    border: 1px solid var(--line-strong);
    padding: 2px 6px;
    border-radius: 3px;
    transform: translateY(-2px);
  }
  header h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    max-width: 46ch;
  }

  main {
    max-width: 1040px;
    margin: 0 auto;
    padding: 36px 40px 72px;
  }

  section {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: 0 1px 0 var(--line);
    padding: 26px 28px;
    margin-bottom: 26px;
  }
  section > h2 {
    margin: 0 0 16px;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  .dropzone {
    border: 1.5px dashed var(--line-strong);
    border-radius: 2px;
    padding: 30px;
    text-align: center;
    color: var(--ink-soft);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-size: 14px;
  }
  .dropzone:hover, .dropzone.drag {
    border-color: var(--stamp-ink);
    background: var(--stamp-ink-soft);
    color: var(--ink);
  }
  .dropzone input { display: none; }

  .upload-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
    align-items: center;
    flex-wrap: wrap;
  }
  input[type=text], input[type=email], select {
    font-family: var(--sans);
    font-size: 13.5px;
    padding: 9px 11px;
    border: 1px solid var(--line-strong);
    border-radius: 2px;
    background: #fff;
    color: var(--ink);
  }
  input:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--stamp-ink);
    outline-offset: 1px;
  }
  button {
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 2px;
    border: 1px solid var(--stamp-ink);
    background: var(--stamp-ink);
    color: white;
    cursor: pointer;
  }
  button:hover { background: #352c57; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost {
    background: transparent;
    color: var(--stamp-ink);
    border: 1px solid var(--line-strong);
    padding: 6px 12px;
    font-size: 12.5px;
  }
  button.ghost:hover { border-color: var(--stamp-ink); background: var(--stamp-ink-soft); }

  #upload-status { font-size: 13px; margin-top: 12px; min-height: 18px; font-family: var(--mono); }
  #upload-status.ok { color: var(--paid); }
  #upload-status.err { color: #96321e; }
  @keyframes stamp-in {
    0%   { transform: scale(1.4) rotate(-6deg); opacity: 0; }
    60%  { transform: scale(0.96) rotate(1deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  #upload-status.ok { animation: stamp-in 0.32s cubic-bezier(.2,.9,.3,1.3); transform-origin: left center; }

  .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th {
    text-align: left;
    font-family: var(--serif);
    font-weight: 600;
    color: var(--ink-soft);
    font-size: 12.5px;
    padding: 8px 10px 10px;
    border-bottom: 2px solid var(--line-strong);
  }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f3ede0; }
  td.num { font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
  td.inv { font-family: var(--mono); font-size: 12.5px; color: var(--ink-soft); }

  .stamp {
    display: inline-block;
    font-family: var(--serif);
    font-variant: small-caps;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    padding: 2px 10px;
    border: 1.5px solid currentColor;
    border-radius: 3px;
    transform: rotate(-2deg);
  }
  .stamp.paid, .stamp.confirmed { color: var(--paid); background: var(--paid-wash); }
  .stamp.unpaid, .stamp.unknown, .stamp.pending_review, .stamp.partially_paid {
    color: var(--pending); background: var(--pending-wash); transform: rotate(1.5deg);
  }

  a.filelink { color: var(--stamp-ink); text-decoration: none; font-size: 12.5px; font-weight: 500; }
  a.filelink:hover { text-decoration: underline; }
  #empty { color: var(--ink-soft); font-size: 13.5px; padding: 26px 0; text-align: center; font-family: var(--serif); }

  @media (max-width: 640px) {
    header, main { padding-left: 20px; padding-right: 20px; }
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
    td { border: none; padding: 3px 0; }
    td.num { text-align: left; }
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">
      <h1>MPPL Bills</h1>
      <span class="folio">Ledger</span>
    </div>
    <p>Upload a bill — it's read, filed to Drive, and entered into the ledger automatically.</p>
  </div>
</header>

<main>
  <section>
    <h2>Upload</h2>
    <div class="dropzone" id="dropzone">
      <div id="dropzone-label">Drop a bill here (JPG, PNG, or PDF) — or click to choose a file</div>
      <input type="file" id="file-input" accept=".jpg,.jpeg,.png,.pdf">
    </div>
    <div class="upload-row">
      <input type="email" id="uploaded-by" placeholder="your email">
      <button id="upload-btn" disabled>Upload &amp; extract</button>
    </div>
    <div id="upload-status"></div>
  </section>

  <section>
    <h2>Bills</h2>
    <div class="filters">
      <input type="text" id="f-vendor" placeholder="Search vendor…">
      <select id="f-payment">
        <option value="">Any payment status</option>
        <option value="paid">Paid</option>
        <option value="unpaid">Unpaid</option>
        <option value="partially_paid">Partially paid</option>
        <option value="unknown">Unknown</option>
      </select>
      <select id="f-review">
        <option value="">Any review status</option>
        <option value="pending_review">Pending review</option>
        <option value="confirmed">Confirmed</option>
      </select>
      <button class="ghost" id="refresh-btn">Refresh</button>
    </div>
    <table id="bills-table">
      <thead>
        <tr>
          <th>Vendor</th><th>Invoice</th><th>Date</th><th style="text-align:right">Amount</th>
          <th>Payment</th><th>Review</th><th>File</th><th></th>
        </tr>
      </thead>
      <tbody id="bills-body"></tbody>
    </table>
    <div id="empty" style="display:none">No bills match those filters yet.</div>
  </section>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const dzLabel = document.getElementById('dropzone-label');
const uploadBtn = document.getElementById('upload-btn');
const uploadedByInput = document.getElementById('uploaded-by');
const statusEl = document.getElementById('upload-status');

let selectedFile = null;

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => { if (fileInput.files.length) setFile(fileInput.files[0]); });

function setFile(f) {
  selectedFile = f;
  dzLabel.textContent = `Selected: ${f.name}`;
  uploadBtn.disabled = false;
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  const uploadedBy = uploadedByInput.value.trim() || 'unknown';

  uploadBtn.disabled = true;
  statusEl.className = '';
  statusEl.textContent = 'Reading and filing the bill — this takes a few seconds…';

  const form = new FormData();
  form.append('file', selectedFile);
  form.append('uploaded_by', uploadedBy);

  try {
    const res = await fetch('/api/upload', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Upload failed');

    statusEl.className = 'ok';
    statusEl.textContent = `Filed — ${data.extracted.vendor_name}, ₹${data.extracted.amount ?? '?'}. Pending review.`;
    selectedFile = null;
    fileInput.value = '';
    dzLabel.textContent = 'Drop a bill here (JPG, PNG, or PDF) — or click to choose a file';
    loadBills();
  } catch (err) {
    statusEl.className = 'err';
    statusEl.textContent = err.message;
  } finally {
    uploadBtn.disabled = false;
  }
});

const body = document.getElementById('bills-body');
const emptyEl = document.getElementById('empty');

function stamp(text, cls) {
  return `<span class="stamp ${cls}">${text.replace('_', ' ')}</span>`;
}

async function loadBills() {
  const params = new URLSearchParams();
  const vendor = document.getElementById('f-vendor').value.trim();
  const payment = document.getElementById('f-payment').value;
  const review = document.getElementById('f-review').value;
  if (vendor) params.set('vendor', vendor);
  if (payment) params.set('payment_status', payment);
  if (review) params.set('review_status', review);

  const res = await fetch('/api/bills?' + params.toString());
  const rows = await res.json();

  body.innerHTML = '';
  emptyEl.style.display = rows.length ? 'none' : 'block';

  for (const r of rows) {
    const tr = document.createElement('tr');
    const amount = r.amount != null ? Number(r.amount).toLocaleString('en-IN', { minimumFractionDigits: 2 }) : '—';
    tr.innerHTML = `
      <td>${r.vendor_name || ''}</td>
      <td class="inv">${r.invoice_no || '—'}</td>
      <td>${r.invoice_date || '—'}</td>
      <td class="num">${amount}</td>
      <td>${stamp(r.payment_status || 'unknown', r.payment_status || 'unknown')}</td>
      <td>${stamp(r.review_status || 'pending_review', r.review_status || 'pending_review')}</td>
      <td>${r.drive_link ? `<a class="filelink" href="${r.drive_link}" target="_blank">Open</a>` : '—'}</td>
      <td>${r.review_status === 'pending_review' ? `<button class="ghost" data-id="${r.id}">Confirm</button>` : ''}</td>
    `;
    body.appendChild(tr);
  }

  body.querySelectorAll('button[data-id]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-id');
      const confirmedBy = uploadedByInput.value.trim() || 'unknown';
      await fetch('/api/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: Number(id), confirmed_by: confirmedBy }),
      });
      loadBills();
    });
  });
}

document.getElementById('refresh-btn').addEventListener('click', loadBills);
document.getElementById('f-vendor').addEventListener('keydown', e => { if (e.key === 'Enter') loadBills(); });
document.getElementById('f-payment').addEventListener('change', loadBills);
document.getElementById('f-review').addEventListener('change', loadBills);

loadBills();
</script>
</body>
</html>
